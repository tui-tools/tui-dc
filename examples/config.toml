# tui-dc configuration.
#
# Read from /etc/tui-dc/config.toml first, then
# ~/.config/tui-dc/config.toml, then TUI_DC_* in the environment, then the
# command line — each layer overriding the one before it.
#
# Copy this file to one of those paths and edit it. Every key here is a default
# rather than a requirement: a machine with no configuration file at all runs
# the tool exactly as it is shipped.

# The domain controller the read path asks. It defaults to this host, because
# tui-dc administers the controller it runs on: pointing it at a remote one is
# a different trust relationship and would need credentials this tool does not
# take.
#
# Also: TUI_DC_SERVER, or --server.
server = "127.0.0.1"

# The privilege escalation prefix. samba-tool opens the directory database
# directly and that database is readable only by root, so this applies to the
# reads as well as to the changes — there is no unprivileged read path to fall
# back on.
#
# Set it to "" to run samba-tool directly, which is what you want when tui-dc
# itself is already running as root.
#
# Also: TUI_DC_SUDO, or --sudo.
sudo = "sudo -n"

# Path to an Omarchy-style colors.toml. Empty follows the same detection the
# rest of the family does, and NO_COLOR is honoured either way.
#
# Also: TUI_DC_THEME, or --theme.
theme = ""
